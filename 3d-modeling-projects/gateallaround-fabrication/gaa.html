<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GAA Flashcard Tutorial</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background-color: #555;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: row;
      background-color: #f0f0f0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .viewer {
      flex: 1;
      max-width: 65vw;
      max-height: 70vh;
      background-color: white;
      margin-right: 20px;
      box-sizing: border-box;
      border-radius: 8px;
      overflow: hidden;
    }

    .flashcard {
      width: 400px;
      max-height: 70vh;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 300px;
      font-size: 1.2em;
      font-weight: 500;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
      cursor: pointer;
      box-sizing: border-box;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card .front,
    .card .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #ffffff;
      white-space: pre-line;
      text-align: left;
    }

    .card .back {
      transform: rotateY(180deg);
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h2>GAA Process Steps</h2>
    <button onclick="showStep('Step 1: Stack Nanosheets', 
        'Stack alternating layers of Si and SiGe\n• Start with a Silicon wafer\n• Deposit SiGe and Si in alternating layers\n• Use chemical vapor deposition', 
        'stack_nanosheets.glb')">Stack Nanosheets</button>
    <button onclick="showStep('Step 2: Etch Gate Trenches', 
        'Pattern the gate trenches using lithography\n• Apply photoresist\n• Expose and develop to create trench pattern\n• Etch vertically to form deep trenches', 
        'etch_gate_trenches.glb')">Etch Gate Trenches</button>
    <button onclick="showStep('Step 3: Deposit Gate Oxide and Metal', 
        'Deposit gate oxide for insulation\n• ALD of high-k gate dielectric\n• Follow with metal gate deposition\n• CMP to planarize', 
        'deposit_gate_material.glb')">Deposit Gate Oxide and Metal</button>
    <button onclick="showStep('Step 4: Form GAA Structure', 
        'Remove sacrificial SiGe layers\n• Leave Si nanosheets suspended\n• Finalize with spacer and contact formation\n• Complete the device stack', 
        'form_gaa_structure.glb')">Form GAA Structure</button>
  </div>

  <div class="content">
    <div class="viewer"></div>
    <div id="model-error" style="color: red; margin-top: 10px; display: none;"></div>
    <div class="flashcard">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="front" id="card-front">Click a step</div>
        <div class="back" id="card-back">Flashcard info</div>
      </div>
    </div>
  </div>

  <!-- Three.js, GLTFLoader, and OrbitControls -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

  <script>
    const viewer = document.querySelector('.viewer');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(
      75,
      viewer.clientWidth / viewer.clientHeight,
      0.1,
      1000
    );
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    viewer.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enablePan = true;
    controls.update();

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    const loader = new THREE.GLTFLoader();
    let currentModel = null;

    camera.position.z = 5;

    function loadModel(modelPath) {
      if (currentModel) {
        scene.remove(currentModel);
        disposeModel(currentModel);
        currentModel = null;
      }
      loader.load(
        modelPath,
        function (gltf) {
          currentModel = gltf.scene;
          scene.add(currentModel);
          document.getElementById('model-error').style.display = 'none';
        },
        undefined,
        function (error) {
          console.error('Error loading model:', error);
          const errorDiv = document.getElementById('model-error');
          errorDiv.innerText = 'Error loading 3D model: ' + (error.message || error);
          errorDiv.style.display = 'block';
        }
      );
    }

    function disposeModel(model) {
      model.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (child.material.isMaterial) {
            cleanMaterial(child.material);
          } else {
            for (const material of child.material) cleanMaterial(material);
          }
        }
      });
    }

    function cleanMaterial(material) {
      material.dispose();
      for (const key in material) {
        const value = material[key];
        if (value && typeof value === 'object' && 'minFilter' in value) {
          value.dispose();
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    function showStep(title, content, modelPath) {
      document.getElementById('card-front').innerText = title;
      document.getElementById('card-back').innerText = content;
      document.querySelector('.card').classList.remove('flipped');
      loadModel(modelPath);
    }

    window.addEventListener('resize', () => {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>

</html>
