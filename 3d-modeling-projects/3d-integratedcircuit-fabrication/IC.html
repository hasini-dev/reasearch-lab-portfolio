<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D IC Fabrication Tutorial</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 250px;
      background-color: #1a1a1a;
      color: white;
      padding: 20px;
      box-sizing: border-box;
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #333;
      color: white;
      border: none;
      cursor: pointer;
      text-align: left;
    }

    .sidebar button:hover {
      background-color: #555;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: row;
      background-color: #f0f0f0;
      padding: 20px;
      box-sizing: border-box;
      overflow: hidden;
    }

    .viewer {
      flex: 1;
      max-width: 65vw;
      max-height: 70vh;
      background-color: white;
      margin-right: 20px;
      box-sizing: border-box;
      border-radius: 8px;
      overflow: hidden;
    }

    .flashcard {
      width: 400px;
      max-height: 70vh;
      perspective: 1000px;
    }

    .card {
      width: 100%;
      height: 300px;
      font-size: 1.1em;
      font-weight: 500;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s;
      cursor: pointer;
      box-sizing: border-box;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card .front,
    .card .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #ffffff;
      white-space: pre-line;
      text-align: left;
    }

    .card .back {
      transform: rotateY(180deg);
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2>3D IC Steps</h2>
    <button onclick="showStep(0)">Overview</button>
    <button onclick="showStep(1)">Wafer Preparation</button>
    <button onclick="showStep(2)">TSV Formation</button>
    <button onclick="showStep(3)">Die Fabrication</button>
    <button onclick="showStep(4)">Wafer Thinning</button>
    <button onclick="showStep(5)">Wafer Bonding</button>
    <button onclick="showStep(6)">Interposer Fabrication</button>
    <button onclick="showStep(7)">Stacking</button>
    <button onclick="showStep(8)">Packaging</button>
  </div>

  <div class="content">
    <div class="viewer" id="viewer"></div>
    <div class="flashcard">
      <div class="card" onclick="this.classList.toggle('flipped')">
        <div class="front" id="card-front">Click a step</div>
        <div class="back" id="card-back">Description</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

  <script>
    const steps = [
      {
        title: "3D IC Overview",
        desc: "3D ICs stack multiple active layers vertically.\n• Enables shorter interconnects and higher density\n• Uses TSVs, wafer thinning, and bonding\n• Challenges: heat, alignment, testing",
        model: null
      },
      {
        title: "Wafer Preparation",
        desc: "Start with ultra-flat silicon wafers.\n• Clean and planarize with CMP\n• Prepares for thinning and bonding\n• Ensures surface quality",
        model: "wafer_preparation.glb"
      },
      {
        title: "TSV Formation",
        desc: "Create Through-Silicon Vias.\n• Etch holes with DRIE\n• Line with insulator + barrier\n• Fill with copper and polish",
        model: "tsv_formation.glb"
      },
      {
        title: "Die Fabrication",
        desc: "Build CMOS devices on the wafer.\n• Add metal layers for TSV connection\n• Design must handle stress/thermal effects",
        model: "die_fabrication.glb"
      },
      {
        title: "Wafer Thinning",
        desc: "Reduce thickness to access TSVs.\n• Use grinding + chemical etch\n• Temporary carrier supports wafer\n• Enables stacking",
        model: "wafer_thinning.glb"
      },
      {
        title: "Wafer Bonding",
        desc: "Stack wafers using precision bonding.\n• Techniques: Cu-Cu, oxide-oxide, adhesives\n• Requires <1μm alignment",
        model: "wafer_bonding.glb"
      },
      {
        title: "Interposer Fabrication",
        desc: "Add intermediate routing layer.\n• Uses TSVs + RDLs\n• Connects different chiplets\n• Can be silicon or organic",
        model: "inter.glb"
      },
      {
        title: "Stacking",
        desc: "Assemble multiple dies/wafers.\n• Die-to-die, die-to-wafer, wafer-to-wafer\n• Challenges: thermal, alignment",
        model: "stack.glb"
      },
      {
        title: "Packaging",
        desc: "Final protection and signal routing.\n• Add bumps, heat sinks, underfill\n• Test and seal the device",
        model: "packaging.glb"
      }
    ];

    let scene, camera, renderer, controls, currentModel;

    const viewer = document.getElementById("viewer");

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(75, viewer.clientWidth / viewer.clientHeight, 0.1, 1000);
    camera.position.z = 5;

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(viewer.clientWidth, viewer.clientHeight);
    viewer.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0x404040);
    scene.add(ambientLight);

    const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
    directionalLight.position.set(1, 1, 1);
    scene.add(directionalLight);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.update();

    const loader = new THREE.GLTFLoader();

    function loadModel(path) {
      if (currentModel) {
        scene.remove(currentModel);
        disposeModel(currentModel);
      }
      if (!path) {
        return; // No model to load
      }
      loader.load(path, (gltf) => {
        currentModel = gltf.scene;
        scene.add(currentModel);
        const box = new THREE.Box3().setFromObject(currentModel);
        const center = box.getCenter(new THREE.Vector3());
        currentModel.position.sub(center);
        controls.target.copy(center);
        controls.update();
      }, undefined, (error) => {
        console.error("Model load error:", error);
      });
    }

    function disposeModel(model) {
      model.traverse((child) => {
        if (child.isMesh) {
          child.geometry.dispose();
          if (Array.isArray(child.material)) {
            child.material.forEach(m => m.dispose());
          } else {
            child.material.dispose();
          }
        }
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
      controls.update();
    }
    animate();

    function showStep(index) {
      const step = steps[index];
      document.getElementById('card-front').innerText = step.title;
      document.getElementById('card-back').innerText = step.desc;
      document.querySelector('.card').classList.remove('flipped');
      loadModel(step.model);
    }

    window.addEventListener("resize", () => {
      const width = viewer.clientWidth;
      const height = viewer.clientHeight;
      camera.aspect = width / height;
      camera.updateProjectionMatrix();
      renderer.setSize(width, height);
    });
  </script>
</body>
</html>
